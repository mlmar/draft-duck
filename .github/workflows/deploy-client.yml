# Static client to the build/client branch. Pages serves that branch at /draft-duck/.
# Same triggers as deploy-api: push to main or dispatch. Do not use pull_request closed.
name: Deploy client

on:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - run: npm ci

            - name: Require Cloud Run origin
              env:
                  PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
              run: node app/client/scripts/assert-public-api-url.mjs

            - name: Build
              run: npm run build -w @draft-duck/client
              env:
                  PUBLIC_BASE_PATH: /draft-duck/
                  PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}

            - name: Publish build/client
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: app/client/dist/client
                  publish_branch: build/client
                  force_orphan: true
